<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Andysmanga</title>
    <meta name="description" content="Minimal bookshelf manga library" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
    </script>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand">
          <p class="eyebrow">Library</p>
          <h1>Andysmanga</h1>
        </div>
      </header>

      <main id="shelfContainer" class="shelf-container"></main>
    </div>

    <div class="reader-backdrop" id="readerModal" aria-hidden="true">
      <div class="reader-panel" role="dialog" aria-modal="true" aria-labelledby="readerTitle">
        <header class="reader-header">
          <div>
            <p class="reader-kicker">Reader</p>
            <h2 id="readerTitle">Volume</h2>
          </div>
          <button class="close-btn" id="closeReader" aria-label="Close reader">×</button>
        </header>

        <div class="reader-toolbar">
          <button class="page-btn" id="prevPage">← Prev</button>
          <span id="readerProgress" class="reader-progress">1 / 1</span>
          <button class="page-btn" id="nextPage">Next →</button>
        </div>

        <div class="reader-stage">
          <div class="reader-pages" id="readerPages"></div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
