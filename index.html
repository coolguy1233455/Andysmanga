<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Andysmanga | Manga Vault</title>
    <meta name="description" content="A simple manga reading hub." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
  </head>
  <body>
    <header class="header">
      <div class="header-content">
        <h1 class="site-title">Andysmanga</h1>
      </div>
    </header>

    <main class="main-content">
      <section class="shelf-section">
        <h2 class="shelf-title">Jujutsu Kaisen</h2>
        <div class="book-grid" id="jjk-grid"></div>
      </section>
    </main>

    <div class="reader-backdrop" id="readerModal" aria-hidden="true">
      <div class="reader-panel" role="dialog" aria-modal="true" aria-labelledby="readerTitle">
        <header class="reader-header">
          <h2 id="readerTitle">Manga</h2>
          <button class="close-btn" id="closeReader" aria-label="Close reader">✕</button>
        </header>

        <div class="reader-toolbar">
          <button class="page-btn" id="prevPage" aria-label="Previous pages">← Prev</button>
          <span class="page-counter" id="readerProgress">1 / 1</span>
          <button class="page-btn" id="nextPage" aria-label="Next pages">Next →</button>
        </div>

        <div class="reader-stage">
          <div class="reader-pages" id="readerPages"></div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
